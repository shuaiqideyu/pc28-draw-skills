[project]
name = "pc28draw"
version = "0.2.0"
description = "加拿大 Keno 开奖检测：BCLC / PlayNow 直连，换成 PC28"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yuuu" }]
dependencies = [
  "curl_cffi>=0.16.3",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.scripts]
pc28draw = "collector.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
